name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            ldflags: ""
          - goos: linux
            goarch: arm64
            suffix: ""
            ldflags: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            ldflags: "-H=windowsgui"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags "${{ matrix.ldflags }}" -o server${{ matrix.suffix }} ./cmd/server/

      - name: Package
        run: |
          mkdir -p dist/ccnew-vdl
          cp server${{ matrix.suffix }} dist/ccnew-vdl/
          cp -r static dist/ccnew-vdl/
          cp start-desktop.bat dist/ccnew-vdl/ 2>/dev/null || true
          cp config.json.example dist/ccnew-vdl/ 2>/dev/null || true
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}.zip ccnew-vdl/
          else
            tar czf ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ccnew-vdl/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ccnew-vdl-*

  build-installer:
    runs-on: windows-latest
    needs: build-binary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ccnew-vdl-windows-amd64
          path: build/

      - name: Extract and prepare
        shell: pwsh
        run: |
          cd build
          Expand-Archive -Path ccnew-vdl-windows-amd64.zip -DestinationPath .
          Copy-Item ccnew-vdl/server.exe ../server.exe
          Copy-Item -Recurse ccnew-vdl/static ../static

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis.exe /V2 installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ccnew-vdl-setup
          path: ccnew-vdl-setup.exe

  release:
    needs: [build-binary, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: build-binary
    continue-on-error: true
    steps:
      - name: Check token
        id: check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "DOCKERHUB_TOKEN not set, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          username: wsc768043912
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        if: steps.check.outputs.skip != 'true'
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            wsc768043912/ccnew-vdl:latest
            wsc768043912/ccnew-vdl:${{ steps.version.outputs.VERSION }}