name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ldflags: ""
            ffmpeg_name: "ffmpeg-linux-amd64"
            suffix: ""
          - goos: linux
            goarch: arm64
            ldflags: ""
            ffmpeg_name: "ffmpeg-linux-arm64"
            suffix: ""
          - goos: windows
            goarch: amd64
            ldflags: "-H=windowsgui"
            ffmpeg_name: "ffmpeg-windows-amd64.exe"
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags "${{ matrix.ldflags }} -X main.Version=${{ github.ref_name }}" -o server${{ matrix.suffix }} ./cmd/server/

      - name: Package
        run: |
          mkdir -p dist/ccnew-vdl/ffmpeg
          cp server${{ matrix.suffix }} dist/ccnew-vdl/
          cp -r static dist/ccnew-vdl/
          cp -r webview2 dist/ccnew-vdl/
          cp ffmpeg/${{ matrix.ffmpeg_name }} dist/ccnew-vdl/ffmpeg/
          cp start-desktop.bat dist/ccnew-vdl/ 2>/dev/null || true
          cp config.json.example dist/ccnew-vdl/ 2>/dev/null || true
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}.zip ccnew-vdl/
          else
            tar czf ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ccnew-vdl/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ccnew-vdl-*

  build-installer:
    runs-on: windows-latest
    needs: build-binary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ccnew-vdl-windows-amd64
          path: dist/

      - name: Prepare build directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force
          cd dist
          Expand-Archive -Path ccnew-vdl-windows-amd64.zip -DestinationPath .
          Copy-Item ccnew-vdl/server.exe ../build/server.exe
          Copy-Item -Recurse ccnew-vdl/static ../build/static
          Copy-Item -Recurse ccnew-vdl/webview2 ../build/webview2
          New-Item -ItemType Directory -Path ../build/ffmpeg -Force
          Copy-Item ccnew-vdl/ffmpeg/ffmpeg-windows-amd64.exe ../build/ffmpeg/ffmpeg-windows-amd64.exe

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /O"." /DMyAppVersion=${{ github.ref_name }}

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash 'ccnew-vdl-setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$h  ccnew-vdl-setup.exe" | Out-File -Encoding ascii 'ccnew-vdl-setup.exe.sha256'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ccnew-vdl-setup
          path: |
            ccnew-vdl-setup.exe
            ccnew-vdl-setup.exe.sha256

  release:
    needs: [build-binary, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: build-binary
    continue-on-error: true
    steps:
      - name: Check token
        id: check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          username: wsc768043912
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        if: steps.check.outputs.skip != 'true'
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            wsc768043912/ccnew-vdl:latest
            wsc768043912/ccnew-vdl:${{ steps.version.outputs.VERSION }}
