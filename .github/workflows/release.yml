name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o server${{ matrix.suffix }} ./cmd/server/

      - name: Package
        run: |
          mkdir -p dist/ccnew-vdl
          cp server${{ matrix.suffix }} dist/ccnew-vdl/
          cp -r static dist/ccnew-vdl/
          cp start-desktop.bat dist/ccnew-vdl/ 2>/dev/null || true
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}.zip ccnew-vdl/
          else
            tar czf ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ccnew-vdl/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccnew-vdl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ccnew-vdl-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true