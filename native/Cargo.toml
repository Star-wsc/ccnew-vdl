[package]
name = "ccnew-native"
version = "1.3.4"
edition = "2021"
description = "CCNEW 视频下载器 - Windows 原生版"

[dependencies]
slint = "1.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
urlencoding = "2"
futures-util = "0.3"
dirs = "6"

[build-dependencies]
slint-build = "1.12"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
