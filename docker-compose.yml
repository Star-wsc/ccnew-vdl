version: '3.8'

services:
  video-downloader:
    image: wsc768043912/ccnew-vdl:latest
    container_name: video-downloader
    ports:
      - "19000:18000"
    volumes:
      - /vol1/1000/ls/TT:/downloads
      - ./config:/root/.config/ccnew-vdl
      - ./logs:/logs
    environment:
      - PORT=18000
      - DOWNLOAD_DIR=/downloads
      # B站Cookie（可选，用于4K下载）
      # - BILIBILI_COOKIE=your_cookie_here
      # 抖音Cookie（可选）
      # - DOUYIN_COOKIE=your_cookie_here
    restart: unless-stopped
