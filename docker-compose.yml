version: '3.8'

services:
  video-downloader:
    build: .
    container_name: video-downloader
    ports:
      - "18000:18000"
    volumes:
      - ./downloads:/downloads
      - ./logs:/logs
    environment:
      - PORT=18000
      - DOWNLOAD_DIR=/downloads
      - LOG_DIR=/logs
      # B站Cookie（可选，用于4K下载）
      # - BILIBILI_COOKIE=your_cookie_here
      # 抖音Cookie（可选）
      # - DOUYIN_COOKIE=your_cookie_here
      # 代理设置（可选）
      # - PROXY=http://proxy:8080
    restart: unless-stopped
