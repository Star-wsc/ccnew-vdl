        /* Dark mode toggle button */
        .theme-toggle {
            background: none;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            color: var(--gray-600);
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            background: var(--gray-100);
            border-color: var(--gray-300);
        }
        [data-theme="dark"] .theme-toggle {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        [data-theme="dark"] .theme-toggle:hover {
            background: rgba(255,255,255,0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .theme-toggle {
                border-color: var(--border-color);
                color: var(--text-secondary);
            }
            :root:not([data-theme="light"]) .theme-toggle:hover {
                background: rgba(255,255,255,0.05);
            }
        }

        .progress-speed {

            padding: 4px 8px;
            font-size: 11px;
            color: var(--gray-500);

            align-items: center;
            gap: 4px;

        }
        .copy-link-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, 0.05);

        .copy-link-btn.copied {
            border-color: var(--success);

        [data-theme="dark"] .copy-link-btn {

            </div>
        </header>

            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="section-title">添加任务</div>

                    </div>
                    <select class="quality-select" id="qualitySelect">
                        <option value="4k" selected>4K 超高清 (推荐)</option>
                        <option value="2k">2K 高清</option>
                        <option value="1080p">1080P 全高清</option>
                        <option value="720p">720P 高清</option>
                        <option value="480p">480P 标清</option>
                    </select>
                    <button class="add-btn" id="addTaskBtn" onclick="addTask()">
                        <span>+</span> 添加下载任务
                    </button>
                </div>
                
                <div class="sidebar-section">
                    <div class="section-title">任务统计</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="statTotal">0</div>
                            <div class="stat-label">全部任务</div>
                        </div>
                        <div class="stat-card warning">
                            <div class="stat-value" id="statDownloading">0</div>
                            <div class="stat-label">下载中</div>
                        </div>
                        <div class="stat-card success">
                            <div class="stat-value" id="statCompleted">0</div>
                            <div class="stat-label">已完成</div>
                        </div>
                        <div class="stat-card danger">
                            <div class="stat-value" id="statFailed">0</div>
                            <div class="stat-label">失败</div>
                        </div>
                    </div>
                    <div style="margin-top:8px;font-size:12px;color:var(--gray-500);display:flex;gap:12px;">
                        <span>单视频: <strong id="statSingleTotal">0</strong></span>
                        <span>合集: <strong id="statCollections">0</strong></span>
                    </div>
                </div>
                
                <div class="sidebar-section preview-section">
                    <div class="section-title">预览</div>
                    <div class="preview-container" id="previewContainer">
                        <div class="empty-state">
                            <div class="empty-icon">🎬</div>
                            <div class="empty-title">粘贴链接自动预览</div>
                            <div class="empty-desc">支持单视频和合集链接</div>
                        </div>
                    </div>
                </div>
            </aside>
            
            <div class="middle-panel">
                <div class="task-mode-toggle">
                    <button class="task-mode-btn active" id="singleModeBtn" onclick="switchTaskMode('single')">单视频任务</button>
                    <button class="task-mode-btn" id="collectionModeBtn" onclick="switchTaskMode('collection')">合集任务</button>
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-status="" onclick="filterTasks('')">全部</button>
                    <button class="filter-tab" data-status="downloading" onclick="filterTasks('downloading')">下载中</button>
                    <button class="filter-tab" data-status="completed" onclick="filterTasks('completed')">已完成</button>
                    <button class="filter-tab" data-status="failed" onclick="filterTasks('failed')">失败</button>
                </div>
                
                <div class="task-list" id="taskList">
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div class="empty-title">暂无任务</div>
                        <div class="empty-desc">粘贴链接后点击添加任务</div>
                    </div>
                </div>
                
                <div class="task-list" id="collectionList" style="display: none;">
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div class="empty-title">暂无合集任务</div>
                        <div class="empty-desc">粘贴合集链接后添加下载</div>
                    </div>
                </div>
            </div>
            
            <main class="content-area">
                <div class="content-history-section">
                    <div class="section-header">
                        <span class="section-title-inline">下载历史</span>
                        <button class="section-refresh-btn" onclick="loadHistory()">🔄</button>
                    </div>
                    <div class="history-list-container" id="historyList">
                        <div class="empty-state">
                            <div class="empty-icon">📁</div>
                            <div class="empty-title">暂无下载历史</div>
                            <div class="empty-desc">完成的任务将显示在这里</div>
                        </div>
                    </div>
                </div>
                
                <div class="content-logs-section">
                    <div class="section-header">
                        <span class="section-title-inline">操作日志</span>
                        <button class="section-refresh-btn" onclick="clearOperationLogs()">🗑</button>
                    </div>
                    <div class="operation-logs-container" id="operationLogs">
                        <div class="empty-state">
                            <div class="empty-icon">📝</div>
                            <div class="empty-title">暂无操作日志</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <nav class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-item active" data-panel="sidebar" onclick="switchMobilePanel('sidebar')">
            <span class="mobile-nav-icon">🎬</span>
            <span class="mobile-nav-text">预览</span>
        </div>
        <div class="mobile-nav-item" data-panel="middle-panel" onclick="switchMobilePanel('middle-panel')">
            <span class="mobile-nav-icon">📋</span>
            <span class="mobile-nav-text">任务</span>
        </div>
        <div class="mobile-nav-item" data-panel="content-area" onclick="switchMobilePanel('content-area')">
            <span class="mobile-nav-icon">📁</span>
            <span class="mobile-nav-text">历史</span>
        </div>
        <div class="mobile-nav-item" onclick="showSettings()">
            <span class="mobile-nav-icon">⚙️</span>
            <span class="mobile-nav-text">设置</span>
        </div>
    </nav>
    
    <script>
        let tasks = [];
        let selectedTaskId = null;
        let selectedCollectionId = null;
        let currentFilter = '';
        let currentTab = 'preview';
        let refreshInterval = null;
        let lastTasksJson = '';
        let operationLogs = [];
        let previewData = null;
        let previewTimeout = null;
        let currentMobilePanel = 'sidebar';

        function switchMobilePanel(panelId) {
            const isMobile = window.innerWidth <= 768;
            if (!isMobile) return;

            currentMobilePanel = panelId;

            document.querySelectorAll('.mobile-nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.panel === panelId);
            });

            document.querySelectorAll('.sidebar, .middle-panel, .content-area').forEach(panel => {
                panel.classList.remove('active');
            });

            const targetPanel = document.querySelector('.' + panelId);
            if (targetPanel) {
                targetPanel.classList.add('active');
            }
        }

        function initMobileLayout() {
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                document.querySelectorAll('.sidebar, .middle-panel, .content-area').forEach(panel => {
                    panel.classList.remove('active');
                });
                
                const activePanel = document.querySelector('.' + currentMobilePanel);
                if (activePanel) {
                    activePanel.classList.add('active');
                }
            } else {
                document.querySelectorAll('.sidebar, .middle-panel, .content-area').forEach(panel => {
                    panel.classList.remove('active');
                });
            }
        }

        window.addEventListener('resize', function() {
            initMobileLayout();
        });
        
        function loadOperationLogs() {
            const saved = localStorage.getItem('operationLogs');
            if (saved) {
                try {
                    operationLogs = JSON.parse(saved);
                } catch (e) {
                    operationLogs = [];
                }
            }
        }
        
        function saveOperationLogs() {
            localStorage.setItem('operationLogs', JSON.stringify(operationLogs.slice(0, 100)));
        }
        
        function addOperationLog(message, type) {
            const log = {
                time: new Date().toLocaleTimeString('zh-CN'),
                message: message,
                type: type || 'info'
            };
            operationLogs.unshift(log);
            if (operationLogs.length > 100) {
                operationLogs.pop();
            }
            saveOperationLogs();
            renderOperationLogs();
        }
        
        function clearOperationLogs() {
            operationLogs = [];
            saveOperationLogs();
            renderOperationLogs();
            showToast('操作日志已清空');
        }
        
        function renderOperationLogs() {
            const container = document.getElementById('operationLogs');
            if (!container) return;
            
            if (operationLogs.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">暂无操作日志</div></div>';
                return;
            }
            
            const logsHtml = operationLogs.map(log => `
                <div class="op-log-item ${log.type}">
                    <span class="op-log-time">${log.time}</span>
                    <span class="op-log-msg">${log.message}</span>
                </div>
            `).join('');
            
            container.innerHTML = logsHtml;
        }
        
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks?status=' + currentFilter);
                tasks = await response.json();
                
                const newTasksJson = JSON.stringify(tasks);
                
                if (newTasksJson !== lastTasksJson) {
                    lastTasksJson = newTasksJson;
                    renderTasks();
                    updateStats();
                } else {
                    const selectedTask = tasks.find(t => t.id === selectedTaskId);
                    if (selectedTask && selectedTask.status === 'downloading') {
                        renderPreview();
                    }
                }
                
                if (selectedTaskId) {
                    const task = tasks.find(t => t.id === selectedTaskId);
                    if (task) {
                        renderPreview();
                    }
                }
            } catch (e) {
                console.error('Load tasks error:', e);
            }
        }
        
        function clearPreview() {
            selectedTaskId = null;
            selectedCollectionId = null;
            previewData = null;
            const container = document.getElementById('previewContainer');
            if (container) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎬</div>
                        <div class="empty-title">粘贴链接自动预览</div>
                        <div class="empty-desc">支持单视频和合集链接</div>
                    </div>
                `;
            }
            renderTasks();
            loadHistory(); // 清空历史显示
        }
        
        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                document.getElementById('statTotal').textContent = stats.total;
                document.getElementById('statDownloading').textContent = stats.downloading;
                document.getElementById('statCompleted').textContent = stats.completed;
                document.getElementById('statFailed').textContent = stats.failed;
                document.getElementById('statSingleTotal').textContent = stats.single_total || 0;
                document.getElementById('statCollections').textContent = stats.collections_total || 0;
                document.getElementById('globalSpeedValue').textContent = stats.global_speed > 0 ? formatSpeed(stats.global_speed) : '0 B/s';
            } catch (e) {
                console.error('Load stats error:', e);
            }
        }
        
        function getPlatformIcon(platform) {
            const icons = {
                'douyin': '<span style="font-size:10px;background:#000;color:#fff;padding:1px 3px;border-radius:2px;margin-right:4px;">抖音</span>',
                'bilibili': '<span style="font-size:10px;background:#fb7299;color:#fff;padding:1px 3px;border-radius:2px;margin-right:4px;">B站</span>',
            };
            return icons[platform] || '';
        }
        
        function getProxyImageUrl(url, platform) {
            if (!url || url.trim() === '') return null;
            // 所有平台的图片都通过代理（避免防盗链/CORS问题）
            return '/api/proxy/image?url=' + encodeURIComponent(url);
        }
        
        const coverUrlCache = new Map();
        
        function getCachedCoverUrl(task) {
            const key = task.id + '_' + task.cover_url;
            if (!coverUrlCache.has(key)) {
                coverUrlCache.set(key, getProxyImageUrl(task.cover_url, task.platform));
            }
            return coverUrlCache.get(key);
        }
        
        function renderTasks() {
            const container = document.getElementById('taskList');
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div class="empty-title">暂无任务</div>
                        <div class="empty-desc">粘贴链接后点击添加任务</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-item ${selectedTaskId === task.id ? 'active' : ''}"
                     onclick="selectTask('${task.id}')">
                    <div class="task-header">
                        <span class="task-id">${getPlatformIcon(task.platform)}#${task.id}</span>
                        <span class="task-status status-${task.status}">${getStatusText(task.status)}</span>
                    </div>
                    <div class="task-title">${task.title || '解析中...'}</div>
                    <div class="task-author">${task.author || ''}</div>
                    ${task.status === 'downloading' ? `
                        <div class="task-progress">
                            <div class="task-progress-bar" style="width: ${task.progress}%"></div>
                        </div>
                        ${task.speed ? `<div class="task-speed">${formatSpeed(task.speed)}</div>` : ''}
                    ` : ''}
                    <div class="task-actions" style="margin-top: 8px;">
                        <button class="action-btn danger" style="font-size: 12px; padding: 4px 8px;" onclick="event.stopPropagation(); deleteTask('${task.id}')">🗑 删除</button>
                    </div>
                </div>
            `).join('');
        }

        function getPlatformName(url) {
            if (!url) return '未知平台';
            if (url.includes('douyin.com') || url.includes('iesdouyin.com')) return '抖音合集';
            if (url.includes('bilibili.com') || url.includes('b23.tv')) return 'B站合集';
            return '合集';
        }

        function getPlatformClass(url) {
            if (!url) return '';
            if (url.includes('douyin.com') || url.includes('iesdouyin.com')) return 'douyin';
            if (url.includes('bilibili.com') || url.includes('b23.tv')) return 'bilibili';
            return '';
        }

        function getStatusText(status) {
            const map = {
                'pending': '等待',
                'parsing': '解析',
                'downloading': '下载中',
                'completed': '完成',
                'failed': '失败',
                'partial': '部分完成'
            };
            return map[status] || status;
        }
        
        function selectTask(taskId) {
            selectedTaskId = taskId;
            selectedCollectionId = null;
            currentTaskMode = 'single';
            renderTasks();
            renderPreview();
            loadHistory(); // 加载单视频下载历史

            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                switchMobilePanel('content-area');
            }
        }
        
        function renderPreview() {
            const container = document.getElementById('previewContainer');
            const task = tasks.find(t => t.id === selectedTaskId);
            
            if (!task) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎬</div>
                        <div class="empty-title">选择任务查看详情</div>
                        <div class="empty-desc">从左侧列表选择一个任务</div>
                    </div>
                `;
                return;
            }
            
            const sizeText = task.file_size ? formatSize(task.file_size) : '-';
            const progressCircle = task.progress || 0;
            const circumference = 2 * Math.PI * 16;
            const offset = circumference - (progressCircle / 100) * circumference;
            
            let actionButtons = '';
            if (task.status === 'failed') {
                actionButtons = `
                    <button class="action-btn primary" onclick="retryTask('${task.id}')">
                        🔄 重试
                    </button>
                `;
            }
            
            container.innerHTML = `
                <div class="preview-card">
                    ${getCachedCoverUrl(task) ? `
                        <div class="preview-cover-wrapper"${task.source_url ? ` onclick="window.open('${task.source_url}', '_blank')" style="cursor:pointer"` : ''}>
                            <img class="preview-cover" src="${getCachedCoverUrl(task)}" alt="封面" onerror="this.parentElement.style.display='none'">
                            ${task.source_url && task.platform === 'douyin' ? `
                                <div class="play-overlay">
                                    <div class="play-btn">\u25B6</div>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}
                    <div class="preview-info">
                        <div class="preview-title">${getPlatformIcon(task.platform)}${task.title || '未知标题'}</div>
                        <div class="preview-author">${task.author || '未知'} · ${(task.actual_quality || task.quality).toUpperCase()}</div>
                        
                        ${task.status === 'downloading' ? `
                            <div class="progress-info">
                                <div class="progress-circle">
                                    <svg width="36" height="36">
                                        <circle class="progress-circle-bg" cx="18" cy="18" r="16"/>
                                        <circle class="progress-circle-fill" cx="18" cy="18" r="16" 
                                            stroke-dasharray="${circumference}" 
                                            stroke-dashoffset="${offset}"/>
                                    </svg>
                                    <div class="progress-text" style="font-size:10px;">${task.progress}%</div>
                                </div>
                                <div class="progress-details">
                                    <div class="progress-label">下载中</div>
                                    <div class="progress-size">${sizeText}</div>
                                    ${task.speed ? `<span class="progress-speed">${formatSpeed(task.speed)}</span>` : ''}
                                </div>
                            </div>
                        ` : `
                            <div class="preview-stats">
                                <div class="preview-stat">
                                    <div class="preview-stat-value">${getStatusText(task.status)}</div>
                                    <div class="preview-stat-label">状态</div>
                                </div>
                                <div class="preview-stat">
                                    <div class="preview-stat-value">${sizeText}</div>
                                    <div class="preview-stat-label">大小</div>
                                </div>
                            </div>
                        `}
                        
                        ${task.error_message ? `
                            <div class="error-message">
                                ⚠️ ${task.error_message}
                            </div>
                        ` : ''}
                        
                        <div class="preview-actions">
                            ${actionButtons}
                            ${task.source_url ? `<button class="copy-link-btn" onclick="event.stopPropagation(); copySourceUrl('${task.id}')">\U0001F4CB 复制链接</button>` : ''}
                            <button class="action-btn danger" onclick="deleteTask('${task.id}')">
                                🗑 删除
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '-';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }
        
        function formatSpeed(bytesPerSecond) {
            if (!bytesPerSecond || bytesPerSecond <= 0) return '';
            if (bytesPerSecond < 1024) return bytesPerSecond.toFixed(0) + ' B/s';
            if (bytesPerSecond < 1024 * 1024) return (bytesPerSecond / 1024).toFixed(1) + ' KB/s';
            return (bytesPerSecond / 1024 / 1024).toFixed(1) + ' MB/s';
        }

        function setupVideoPreview(wrapper) {
            var video = wrapper.querySelector('.preview-video');
            if (!video) return;
            wrapper.addEventListener('mouseenter', function() {
                video.play().catch(function() {});
            });
            wrapper.addEventListener('mouseleave', function() {
                video.pause();
                video.currentTime = 0;
            });
        }
        
        function isCollectionUrl(url) {
            // B站合集
            if (url.includes('space.bilibili.com') && url.includes('/lists/')) {
                return true;
            }
            // 抖音合集（完整URL）
            if (url.includes('douyin.com/collection/')) {
                return true;
            }
            // 抖音短剧
            if (url.includes('iesdouyin.com/share/playlet/detail/')) {
                return true;
            }
            // v.douyin.com is a generic short link, not always a collection
            return false;
        }
        
        async function addTask() {
            const urlInput = document.getElementById('urlInput');
            const qualitySelect = document.getElementById('qualitySelect');
            const btn = document.getElementById('addTaskBtn');
            
            const urlText = urlInput.value.trim();
            if (!urlText) {
                showToast('请输入视频链接');
                return;
            }

            // 从文本中提取URL
            function extractURLs(text) {
                const urlRegex = /https?:\/\/[^\s<>\"']+/g;
                const urls = text.match(urlRegex) || [];
                return urls.map(u => u.replace(/[.,;!?]+$/, '')); // 移除末尾标点
            }

            const lines = urlText.split('\n').filter(u => u.trim());
            let urls = [];
            for (const line of lines) {
                const extracted = extractURLs(line);
                if (extracted.length > 0) {
                    urls.push(...extracted);
                } else if (line.trim().startsWith('http')) {
                    urls.push(line.trim());
                }
            }

            console.log('Extracted URLs:', urls);

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> 添加中...';
            
            let successCount = 0;
            let collectionCount = 0;
            let lastAddedTaskId = null;

            for (const url of urls) {
                const trimmedUrl = url.trim();
                const isDouyinShortLink = trimmedUrl.includes('v.douyin.com/');
                const isCollection = isCollectionUrl(trimmedUrl);
                console.log('[DEBUG] addTask:', { trimmedUrl, isCollection, isDouyinShortLink });

                if (isCollection) {
                    let collectionHandled = false;
                    try {
                        addOperationLog('检测到合集链接，正在预览合集内容...', 'info');

                        const previewResp = await fetch('/api/collections/preview', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: trimmedUrl })
                        });

                        if (previewResp.ok) {
                            const collectionData = await previewResp.json();

                            // 创建合集记录
                            const createResp = await fetch('/api/collections', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    url: trimmedUrl,
                                    title: collectionData.title,
                                    videos: collectionData.videos,
                                    quality: qualitySelect.value,
                                    auto_download: true
                                })
                            });

                            if (createResp.ok) {
                                const newCollection = await createResp.json();
                                collectionCount++;
                                successCount++;
                                collectionHandled = true;
                                addOperationLog('合集预览成功: ' + collectionData.title + ' (' + collectionData.videos.length + '个视频)', 'success');
                            } else {
                                const error = await createResp.json();
                                addOperationLog('创建合集任务失败: ' + error.detail, 'error');
                            }
                        } else {
                            const error = await previewResp.json();
                            addOperationLog('解析合集失败: ' + error.detail, 'error');
                        }
                    } catch (e) {
                        addOperationLog('合集任务创建异常: ' + e.message, 'error');
                    }

                    // 抖音短链接合集解析失败，尝试作为单个视频下载
                    if (!collectionHandled && isDouyinShortLink) {
                        addOperationLog('尝试作为单个视频下载...', 'info');
                        try {
                            const response = await fetch('/api/tasks', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    url: trimmedUrl,
                                    quality: qualitySelect.value
                                })
                            });

                            if (response.ok) {
                                const newTask = await response.json();
                                lastAddedTaskId = newTask.id;
                                successCount++;
                                addOperationLog('单视频任务创建成功', 'success');
                            } else {
                                const error = await response.json();
                                addOperationLog('单视频任务创建失败: ' + (error.detail || '未知错误'), 'error');
                            }
                        } catch (e) {
                            addOperationLog('单视频任务创建异常: ' + e.message, 'error');
                        }
                    }
                } else {
                    try {
                        const response = await fetch('/api/tasks', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                url: trimmedUrl,
                                quality: qualitySelect.value
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            console.log('Response data:', data);
                            // 检查是否是合集信息（包含videos字段）
                            if (data.videos && Array.isArray(data.videos)) {
                                // 这是合集信息，创建合集记录
                                addOperationLog('检测到合集，正在创建合集任务...', 'info');
                                const createResp = await fetch('/api/collections', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        url: trimmedUrl,
                                        title: data.title,
                                        videos: data.videos,
                                        quality: qualitySelect.value,
                                        auto_download: true
                                    })
                                });
                                if (createResp.ok) {
                                    collectionCount++;
                                    successCount++;
                                    addOperationLog('合集任务创建成功: ' + data.title + ' (' + data.videos.length + '个视频)', 'success');
                                }
                            } else {
                                // 这是单视频任务
                                lastAddedTaskId = data.id;
                                successCount++;
                            }
                        }
                    } catch (e) {
                        console.error('Add task error:', e);
                    }
                }
            }
            
            urlInput.value = '';
            selectedTaskId = null;
            await loadTasks();
            await loadCollections();
            
            if (lastAddedTaskId) {
                selectedTaskId = lastAddedTaskId;
                renderPreview();
                renderTasks();
            } else {
                clearPreview();
            }
            
            if (successCount > 0) {
                if (collectionCount > 0) {
                    addOperationLog('成功添加 ' + collectionCount + ' 个合集任务', 'success');
                    showToast('成功添加 ' + collectionCount + ' 个合集任务');
                } else {
                    addOperationLog('成功添加 ' + successCount + ' 个单视频任务', 'success');
                    showToast('成功添加 ' + successCount + ' 个任务');
                }
            } else {
                addOperationLog('添加任务失败', 'error');
                showToast('添加任务失败');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<span>+</span> 添加下载任务';
            
            const isMobile = window.innerWidth <= 768;
            if (isMobile && successCount > 0) {
                switchMobilePanel('middle-panel');
            }
        }
        
        async function deleteTask(taskId) {
            if (!confirm('确定要删除这个任务吗？')) return;

            try {
                await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
                if (selectedTaskId === taskId) {
                    selectedTaskId = null;
                    clearPreview();
                }
                // 重置筛选器，确保显示所有任务
                currentFilter = '';
                // 更新所有筛选标签
                document.querySelectorAll('.filter-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.status === '');
                });
                await loadTasks();
                loadHistory();
                showToast('任务已删除');
            } catch (e) {
                showToast('删除失败');
            }
        }
        
        async function retryTask(taskId) {
            try {
                const response = await fetch(`/api/tasks/${taskId}/retry`, { method: 'POST' });
                if (response.ok) {
                    showToast('任务已重新开始');
                    await loadTasks();
                } else {
                    const data = await response.json();
                    showToast(data.detail || '重试失败');
                }
            } catch (e) {
                showToast('重试失败');
            }
        }
        
        function openFolder(path) {
            showToast('请在下载目录中查看文件');
        }

        function clearCompleted() {
            const completedTasks = tasks.filter(t => t.status === 'completed');
            const completedCollections = collections.filter(c => c.status === 'completed');
            const totalCount = completedTasks.length + completedCollections.length;

            if (totalCount === 0) {
                showToast('没有已完成的任务');
                return;
            }

            // 从设置页面读取是否删除文件
            const deleteFilesCheckbox = document.getElementById('clearCompletedDeleteFiles');
            const deleteFiles = deleteFilesCheckbox ? deleteFilesCheckbox.checked : false;

            // 使用自定义弹窗确认（比 confirm 更可靠）
            const existingDialog = document.getElementById('clearCompletedDialog');
            if (existingDialog) existingDialog.remove();

            const dialog = document.createElement('div');
            dialog.id = 'clearCompletedDialog';
            dialog.innerHTML = `
                <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000;">
                    <div style="background:var(--bg-card,white);border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);">
                        <h3 style="margin:0 0 12px 0;font-size:18px;color:#dc2626;">⚠️ 确认清理</h3>
                        <p style="margin:0 0 16px 0;color:var(--text-secondary,#6b7280);line-height:1.5;">
                            将清理 <strong>${completedTasks.length}</strong> 个单视频任务和 <strong>${completedCollections.length}</strong> 个合集任务
                        </p>
                        ${deleteFiles ? '<p style="margin:0 0 16px 0;color:#dc2626;font-weight:600;">⚠️ 将同时删除所有本地文件，此操作不可撤销！</p>' : ''}
                        <div style="display:flex;gap:12px;justify-content:flex-end;">
                            <button id="clearCompletedCancelBtn" style="padding:8px 16px;border:1px solid var(--border-color,#d1d5db);border-radius:6px;background:var(--bg-card,white);cursor:pointer;color:var(--text-primary,#374151);">取消</button>
                            <button id="clearCompletedConfirmBtn" style="padding:8px 16px;border:none;border-radius:6px;background:#dc2626;color:white;cursor:pointer;">确认清理</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);

            document.getElementById('clearCompletedCancelBtn').onclick = () => {
                dialog.remove();
            };

            document.getElementById('clearCompletedConfirmBtn').onclick = () => {
                dialog.remove();
                doClearCompleted(completedTasks, completedCollections, deleteFiles);
            };
        }

        async function doClearCompleted(completedTasks, completedCollections, deleteFiles) {
            for (const task of completedTasks) {
                try {
                    const url = deleteFiles ? '/api/tasks/' + task.id + '?deleteFile=true' : '/api/tasks/' + task.id;
                    await fetch(url, { method: 'DELETE' });
                } catch (e) {}
            }
            
            for (const col of completedCollections) {
                try {
                    const url = deleteFiles ? '/api/collections/' + col.id + '?deleteFile=true' : '/api/collections/' + col.id;
                    await fetch(url, { method: 'DELETE' });
                } catch (e) {}
            }
            
            selectedTaskId = null;
            selectedCollectionId = null;
            clearPreview();
            
            await loadTasks();
            await loadCollections();
            loadHistory();
            
            let msg = '已清理 ' + completedTasks.length + ' 个单视频任务和 ' + completedCollections.length + ' 个合集任务';
            if (deleteFiles) {
                msg += '（已删除本地文件）';
            }
            showToast(msg);
        }
        
        function filterTasks(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.status === status);
            });
            // 根据当前模式加载对应列表
            if (currentTaskMode === 'single') {
                loadTasks();
            } else {
                renderCollections();
            }
        }
        
        function switchTab(tab) {
            currentTab = tab;
        }
        
        async function loadHistory() {
            const container = document.getElementById('historyList');
            if (!container) return;

            console.log('loadHistory called, selectedTaskId:', selectedTaskId, 'selectedCollectionId:', selectedCollectionId);

            // 如果没有选中任何内容，显示空状态
            if (!selectedTaskId && !selectedCollectionId) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div class="empty-title">未选择内容</div>
                        <div class="empty-desc">选择任务或合集查看下载历史</div>
                    </div>
                `;
                return;
            }

            // 如果选中了合集，显示合集的视频下载历史
            if (selectedCollectionId) {
                console.log('Loading collection history for:', selectedCollectionId);
                try {
                    const response = await fetch('/api/collections/' + selectedCollectionId);
                    console.log('Collection response:', response.status);
                    if (response.ok) {
                        const collection = await response.json();
                        console.log('Collection data:', collection);
                        renderCollectionHistory(collection);
                    } else {
                        // 合集可能已被删除
                        selectedCollectionId = null;
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">📁</div>
                                <div class="empty-title">合集不存在</div>
                            </div>
                        `;
                    }
                } catch (e) {
                    console.error('Load collection history error:', e);
                }
                return;
            }

            // 如果选中了单视频任务，显示单视频下载历史
            try {
                const response = await fetch('/api/tasks?status=completed');
                const historyTasks = await response.json();
                renderHistory(historyTasks);
            } catch (e) {
                console.error('Load history error:', e);
            }
        }

        function renderCollectionHistory(collection) {
            console.log('renderCollectionHistory called', collection);
            const container = document.getElementById('historyList');
            if (!container) return;

            if (!collection.videos || collection.videos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div class="empty-title">合集暂无视频</div>
                    </div>
                `;
                return;
            }

            const colId = collection.id;

            container.innerHTML = collection.videos.map((v, idx) => {
                const statusClass = v.status || 'pending';
                const statusText = {
                    'pending': '等待中',
                    'downloading': '下载中',
                    'completed': '已完成',
                    'failed': '失败'
                }[statusClass] || '等待中';

                const cover = v.cover_url || '';
                const coverHtml = cover ?
                    `<img src="${getProxyImageUrl(cover, 'bilibili')}" alt="封面" onerror="this.parentElement.innerHTML='<div class=\\'no-cover\\'>🎬</div>'">` :
                    '<div class="no-cover">🎬</div>';

                // 进度条（downloading 状态显示百分比）
                const progressPercent = v.progress || 0;
                const progressBar = v.status === 'downloading' ?
                    `<div style="margin-top:6px;">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                            <div class="task-progress" style="flex:1;height:6px;margin:0;">
                                <div class="task-progress-bar" style="width:${progressPercent}%"></div>
                            </div>
                            <span style="font-size:11px;color:var(--primary);font-weight:600;min-width:35px;text-align:right;">${progressPercent}%</span>
                        </div>
                    </div>` : '';

                const statusIcon = {
                    'pending': '⏳',
                    'downloading': '⬇️',
                    'completed': '✅',
                    'failed': '❌'
                }[statusClass] || '⏳';

                // 操作按钮
                let actionButtons = '';
                if (v.status === 'pending' || v.status === 'failed') {
                    actionButtons = `
                        <button class="history-btn-compact primary" style="font-size:11px;padding:4px 10px;"
                            onclick="event.stopPropagation(); downloadSingleCollectionVideo('${colId}', ${idx})">
                            ⬇ 下载
                        </button>`;
                } else if (v.status === 'completed') {
                    actionButtons = `
                        <button class="history-btn-compact primary" style="font-size:11px;padding:4px 10px;"
                            onclick="event.stopPropagation(); openCollectionVideoFile('${colId}', ${idx})">
                            📂 打开
                        </button>
                        <button class="history-btn-compact danger" style="font-size:11px;padding:4px 10px;"
                            onclick="event.stopPropagation(); deleteCollectionVideoFile('${colId}', ${idx})">
                            🗑 删除
                        </button>`;
                }

                return `
                <div class="history-item-compact" style="flex-direction:column;">
                    <div style="display:flex;align-items:center;gap:8px;width:100%;">
                        <div class="history-cover-compact" style="flex-shrink:0;">
                            ${coverHtml}
                        </div>
                        <div class="history-info-compact" style="flex:1;min-width:0;">
                            <div class="history-title-compact">${statusIcon} ${v.title || '未知标题'}</div>
                            <div class="history-meta-compact">
                                ${v.author || '未知'} · <span class="status-${statusClass}">${statusText}</span>
                                ${v.status === 'completed' ? ` · ${formatSize(v.file_size || 0)}` : ''}
                                ${v.status === 'failed' && v.error_message ? ` · ${v.error_message}` : ''}
                            </div>
                        </div>
                        <div style="display:flex;gap:4px;flex-shrink:0;">
                            ${actionButtons}
                        </div>
                    </div>
                    ${progressBar}
                </div>
            `;
            }).join('');
        }

        // 下载合集中的单个视频
        async function downloadSingleCollectionVideo(colId, idx) {
            try {
                const response = await fetch(`/api/collections/${colId}/videos/${idx}/download`, { method: 'POST' });
                if (response.ok) {
                    showToast('下载已启动');
                    addOperationLog('启动下载合集视频 #' + (idx + 1), 'info');
                    // 刷新历史显示
                    setTimeout(() => loadHistory(), 500);
                } else {
                    const error = await response.json();
                    showToast(error.detail || '下载失败');
                }
            } catch (e) {
                showToast('下载失败');
            }
        }

        // 删除合集视频文件并重置状态
        async function deleteCollectionVideoFile(colId, idx) {
            if (!confirm('确定删除此视频文件？删除后状态将重置为"未下载"')) return;
            try {
                const response = await fetch(`/api/collections/${colId}/videos/${idx}/file`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('文件已删除，状态已重置');
                    addOperationLog('删除合集视频文件 #' + (idx + 1), 'info');
                    loadHistory();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '删除失败');
                }
            } catch (e) {
                showToast('删除失败');
            }
        }

        // 打开合集视频文件所在目录
        function openCollectionVideoFile(colId, idx) {
            showToast('请在下载目录中查看文件');
        }

        function renderHistory(historyTasks) {
            const container = document.getElementById('historyList');
            if (!container) return;
            
            if (historyTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div class="empty-title">暂无下载历史</div>
                        <div class="empty-desc">完成的任务将显示在这里</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = historyTasks.map(task => {
                const coverUrl = getCachedCoverUrl(task);
                return `
                <div class="history-item-compact">
                    <div class="history-cover-compact">
                        ` + (coverUrl ? `<img src="` + coverUrl + `" alt="封面" onerror="this.parentElement.innerHTML='<div class=\\'no-cover\\'>🎬</div>'">` : '<div class="no-cover">🎬</div>') + `
                    </div>
                    <div class="history-info-compact">
                        <div class="history-title-compact">` + getPlatformIcon(task.platform) + (task.title || '未知标题') + `</div>
                        <div class="history-meta-compact">` + (task.author || '未知') + ` · ` + formatSize(task.file_size) + ` · ` + (task.actual_quality || task.quality).toUpperCase() + `</div>

                    <div class="history-actions-compact">

                    </div>
                </div>
            `;
            }).join('');

        function formatTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN');
        }
        
        let appVersion = 'v0.6.2';
        let currentTaskMode = 'single';
        let collections = [];
        let previewCache = {};
        const CACHE_EXPIRE_TIME = 5 * 60 * 1000;
        
        function getCachedPreview(url) {
            const cached = previewCache[url];
            if (cached && (Date.now() - cached.timestamp) < CACHE_EXPIRE_TIME) {
                return cached.data;
            }
            return null;
        }
        
        function setCachedPreview(url, data) {
            previewCache[url] = {
                data: data,
                timestamp: Date.now()
            };
        }
        
        function switchTaskMode(mode) {
            currentTaskMode = mode;
            
            document.getElementById('singleModeBtn').classList.toggle('active', mode === 'single');
            document.getElementById('collectionModeBtn').classList.toggle('active', mode === 'collection');
            
            document.getElementById('taskList').style.display = mode === 'single' ? 'block' : 'none';
            document.getElementById('collectionList').style.display = mode === 'collection' ? 'block' : 'none';
            
            if (mode === 'collection') {
                loadCollections();
            }
        }
        
        async function loadCollections() {
            try {
                const response = await fetch('/api/collections');
                if (response.ok) {
                    collections = await response.json();
                    renderCollections();
                }
            } catch (e) {
                console.error('加载合集列表失败:', e);
            }
        }
        
        function renderCollections() {
            const container = document.getElementById('collectionList');

            // 根据当前过滤器筛选合集
            let filteredCollections = collections;
            if (currentFilter) {
                filteredCollections = collections.filter(col => col.status === currentFilter);
            }

            if (filteredCollections.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div class="empty-title">暂无合集任务</div>
                        <div class="empty-desc">粘贴合集链接后添加下载</div>
                    </div>
                `;
                return;
            }

            // 计算合集进度
            container.innerHTML = filteredCollections.map(col => {
                const totalVideos = col.videos ? col.videos.length : 0;
                const completedVideos = col.videos ? col.videos.filter(v => v.status === 'completed').length : 0;
                const progress = totalVideos > 0 ? Math.round(completedVideos * 100 / totalVideos) : 0;

                return `
                <div class="task-item ${selectedCollectionId === col.id ? 'active' : ''}" onclick="selectCollection('${col.id}')">
                    <div class="task-header">
                        <span class="task-id"><span class="platform-badge ${getPlatformClass(col.url)}">${getPlatformName(col.url)}</span>#${col.id}</span>
                        <span class="task-status ${col.subscribed && col.status === 'completed' ? 'status-subscribed' : 'status-' + col.status}">${(col.subscribed && col.status === 'completed') ? '订阅中' : getStatusText(col.status)}</span>
                    </div>
                    <div class="task-title">${col.title || '未知合集'}</div>
                    <div class="task-author">${col.author || '未知作者'} · ${completedVideos}/${totalVideos} 个视频</div>
                    <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px;">
                        <button class="task-btn ${col.subscribed ? 'subscribe-active' : 'subscribe'}" onclick="event.stopPropagation(); toggleSubscribe('${col.id}')" title="${col.subscribed ? '点击取消订阅' : '点击订阅，每小时自动刷新'}">
                            ${col.subscribed ? '🔔 已订阅' : '🔕 订阅'}
                        </button>
                        <button class="task-btn delete" onclick="event.stopPropagation(); deleteCollection('${col.id}')">删除</button>
                    </div>
                    ${col.status === 'downloading' ? `
                        <div class="task-progress">
                            <div class="task-progress-bar" style="width: ${progress}%"></div>
                        </div>
                    ` : ''}
                    ${col.subscribed ? `
                        <div style="font-size: 11px; color: var(--primary); margin-top: 4px;">
                            ⏱ 每 ${col.refresh_interval || 60} 分钟刷新
                        </div>
                    ` : ''}
                </div>
            `}).join('');
        }
        
        async function deleteCollection(id) {
            // 弹窗确认，支持删除文件
            const col = collections.find(c => c.id === id);
            const colTitle = col ? col.title : '未知合集';

            // 移除已存在的弹窗
            const existingDialog = document.getElementById('deleteCollectionDialog');
            if (existingDialog) existingDialog.remove();

            const dialog = document.createElement('div');
            dialog.id = 'deleteCollectionDialog';
            dialog.innerHTML = `
                <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000;">
                    <div style="background:var(--bg-card,white);border-radius:12px;padding:24px;max-width:400px;width:90%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);">
                        <h3 style="margin:0 0 12px 0;font-size:18px;color:var(--text-primary,#111827);">删除合集</h3>
                        <p style="margin:0 0 16px 0;color:var(--text-secondary,#6b7280);line-height:1.5;">
                            确定要删除合集 <strong>${colTitle}</strong> 吗？
                        </p>
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
                            <input type="checkbox" id="deleteColFilesCheckbox" style="width:18px;height:18px;accent-color:#ef4444;">
                            <label for="deleteColFilesCheckbox" style="color:#ef4444;font-weight:500;cursor:pointer;">同时删除已下载的视频文件</label>
                        </div>
                        <div style="display:flex;gap:12px;justify-content:flex-end;">
                            <button id="cancelDeleteColBtn" style="padding:8px 16px;border:1px solid var(--border-color,#d1d5db);border-radius:6px;background:var(--bg-card,white);cursor:pointer;color:var(--text-primary,#374151);">取消</button>
                            <button id="confirmDeleteColBtn" style="padding:8px 16px;border:none;border-radius:6px;background:#ef4444;color:white;cursor:pointer;">确认删除</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);

            // 取消按钮
            document.getElementById('cancelDeleteColBtn').onclick = (e) => {
                e.stopPropagation();
                dialog.remove();
            };

            // 确认删除按钮
            document.getElementById('confirmDeleteColBtn').onclick = async (e) => {
                e.stopPropagation();
                const deleteFiles = document.getElementById('deleteColFilesCheckbox').checked;
                console.log('[DEBUG] deleteCollection: deleteFiles=', deleteFiles, 'checkbox checked=', document.getElementById('deleteColFilesCheckbox').checked);
                dialog.remove();

                try {
                    const url = deleteFiles ? '/api/collections/' + id + '?deleteFile=true' : '/api/collections/' + id;
                    const response = await fetch(url, { method: 'DELETE' });
                    if (response.ok) {
                        addOperationLog('删除合集任务成功' + (deleteFiles ? '（含本地文件）' : ''), 'success');
                        showToast('合集已删除' + (deleteFiles ? '（含本地文件）' : ''));
                        if (selectedCollectionId === id) {
                            selectedCollectionId = null;
                            clearPreview();
                        }
                        loadCollections();
                        loadHistory();
                    } else {
                        showToast('删除失败');
                    }
                } catch (e) {
                    showToast('删除失败');
                }
            };
        }

        async function toggleSubscribe(colId) {
            const col = collections.find(c => c.id === colId);
            if (!col) return;

            const newState = !col.subscribed;

            try {
                const response = await fetch(`/api/collections/${colId}/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscribe: newState,
                        refresh_interval: 60
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    col.subscribed = result.subscribed;
                    col.last_refresh = result.last_refresh;
                    col.refresh_interval = result.refresh_interval;
                    renderCollections();
                    addOperationLog(`${newState ? '开启' : '关闭'}订阅: ${col.title}`, 'info');
                    showToast(newState ? '已开启订阅，每小时自动刷新' : '已关闭订阅');
                } else {
                    const error = await response.json();
                    showToast(error.detail || '操作失败');
                }
            } catch (e) {
                showToast('操作失败');
            }
        }

        function selectCollection(id) {
            selectedCollectionId = id;
            selectedTaskId = null;
            currentTaskMode = 'collection';
            loadCollectionVideos(id);
            loadHistory(); // 加载合集下载历史
        }
        
        async function loadCollectionVideos(id) {
            try {
                const response = await fetch('/api/collections/' + id + '/videos');
                if (response.ok) {
                    const videos = await response.json();
                    renderCollectionVideosPreview(videos);
                }
            } catch (e) {
                console.error('加载合集视频失败:', e);
            }
        }
        
        // 注意：renderCollectionHistory 已在上方定义，此处不需要重复定义
        // loadCollectionHistory 功能已整合到 loadHistory 中
        
        function renderCollectionVideosPreview(videos) {
            const container = document.getElementById('previewContainer');
            
            container.innerHTML = `
                <div class="preview-card collection-preview">
                    <div class="preview-header">
                        <span class="preview-badge">合集详情</span>
                        <span class="preview-title">视频列表</span>
                    </div>
                    <div class="collection-videos-list">
                        ${videos.map(v => `
                            <div class="collection-video-item">
                                <img class="collection-video-thumb" src="${getProxyImageUrl(v.cover_url, 'bilibili')}" alt="">
                                <div class="collection-video-info">
                                    <div class="collection-video-title">${v.title}</div>
                                    <div class="collection-video-meta">
                                        ${v.status === 'completed' ? '✅ 已完成' : v.status === 'failed' ? '❌ 失败' : '⏳ ' + v.status}
                                        ${v.file_size ? ' · ' + formatFileSize(v.file_size) : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                if (config.platform && config.platform !== 'windows') {
                    const scanBtn = document.getElementById('scanLoginBtn');
                    if (scanBtn) scanBtn.style.display = 'none';
                }
                appVersion = config.version || 'v0.4.0';
                const versionElement = document.getElementById('versionInfo');
                if (versionElement) {
                    versionElement.textContent = `版本 ${appVersion}`;
                }
                if (config.first_run) {
                    showFirstRunModal();
                }
                checkForUpdate(appVersion);
            } catch (e) {
                console.error('Failed to load config:', e);
            }
        }

        function showFirstRunModal() {
            const modal = document.createElement('div');

        function renderLogsModal() {
            const container = document.getElementById('logsContainerModal');
            if (!container) return;

            if (logsModal.length === 0) {
                container.innerHTML = '<div style="color: var(--gray-400); text-align: center; padding: 40px;">暂无日志</div>';
                return;
            }

            container.innerHTML = logsModal.map(log => {
                // 兼容两种时间格式: ISO "2026-06-04T01:08:30Z" 和普通 "2026-06-04 01:08:30"
                let timeStr = log.timestamp || '';
                if (timeStr.includes('T')) {
                    timeStr = timeStr.split('T')[1].split('.')[0];
                } else if (timeStr.includes(' ')) {
                    timeStr = timeStr.split(' ')[1] || timeStr;
                }
                return `
                <div class="log-entry">
                    <span class="log-time">${timeStr}</span>
                    <span class="log-level ${log.level}">${log.level}</span>
                    <span class="log-task">${log.task_id || '-'}</span>
                    <span class="log-message">${escapeHtml(log.message)}</span>
                    ${log.details ? `<span class="log-details">${escapeHtml(log.details)}</span>` : ''}
                </div>`;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }
