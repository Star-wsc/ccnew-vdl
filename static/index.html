        async function autoPreview(url) {
            const container = document.getElementById('previewContainer');
            let actualUrl = url;

            // 清除选中的任务，防止定时刷新覆盖新URL的预览
            selectedTaskId = null;
            selectedCollectionId = null;

            const cached = getCachedPreview(url);
            if (cached) {
                if (cached.type === 'collection') {
                    previewData = cached;
                    renderCollectionPreview(cached.data);
                } else {
                    previewData = cached;
                    renderSingleVideoPreview(cached.data);
                }
                addOperationLog('使用缓存的解析结果', 'info');
                return;
            }
            
            // 检测B站合集URL（支持多种格式）
            const isBilibiliCollection = url.includes('space.bilibili.com') && url.includes('/lists/') ||
                url.includes('bilibili.com/bangumi/play/ss') ||
                url.includes('bilibili.com/bangumi/media/md') ||
                url.includes('bilibili.com/medialist/play/ml') ||
                url.includes('space.bilibili.com') && url.includes('/channel/collectiondetail') ||
                url.includes('space.bilibili.com') && url.includes('/channel/seriesdetail') ||
                url.includes('bilibili.com/list/');

            if (isBilibiliCollection) {
                container.innerHTML = '<div class="empty-state"><div class="loading-spinner" style="width:32px;height:32px;border-width:3px;"></div><div class="empty-title">正在解析合集...</div></div>';
                
                try {
                    const response = await fetch('/api/collections/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        previewData = { type: 'collection', url: url, data: data };
                        setCachedPreview(url, previewData);
                        renderCollectionPreview(data);
                        addOperationLog('解析合集成功: ' + data.title + ' (' + data.total_count + '个视频)', 'success');
                    } else {
                        const error = await response.json();
                        container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">解析失败</div><div class="empty-desc">' + (error.detail || '未知错误') + '</div></div>';
                        addOperationLog('解析合集失败: ' + (error.detail || '未知错误'), 'error');
                    }
                } catch (e) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">解析失败</div><div class="empty-desc">' + e.message + '</div></div>';
                    addOperationLog('解析合集失败: ' + e.message, 'error');
                }
            } else if (url.includes('bilibili.com/video/') || url.includes('b23.tv/')) {
                container.innerHTML = '<div class="empty-state"><div class="loading-spinner" style="width:32px;height:32px;border-width:3px;"></div><div class="empty-title">正在解析视频...</div></div>';
                
                try {
                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url, quality: 'preview' })
                    });
                    
                    if (response.ok) {
                        const task = await response.json();
                        previewData = { type: 'single', url: url, data: task };
                        setCachedPreview(url, previewData);
                        renderSingleVideoPreview(task);
                        addOperationLog('解析视频成功: ' + (task.title || '未知标题'), 'success');
                    } else {
                        const error = await response.json();
                        container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">解析失败</div><div class="empty-desc">' + (error.detail || '未知错误') + '</div></div>';
                        addOperationLog('解析视频失败: ' + (error.detail || '未知错误'), 'error');
                    }
                } catch (e) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">解析失败</div><div class="empty-desc">' + e.message + '</div></div>';
                    addOperationLog('解析视频失败: ' + e.message, 'error');
                }
            } else if (url.includes('douyin.com') || url.includes('v.douyin.com') || url.includes('iesdouyin.com')) {
                // 从消息中提取URL（用户可能粘贴的是分享消息）
                let actualUrl = url;
                const urlMatch = url.match(/https?:\/\/[^\s]+/);
                if (urlMatch) {
                    actualUrl = urlMatch[0];
                    console.log('[DEBUG] 从消息中提取URL:', actualUrl);
                }

                // 所有抖音链接（包括短链接）统一走单视频解析接口，合集功能暂时屏蔽
                container.innerHTML = '<div class="empty-state"><div class="loading-spinner" style="width:32px;height:32px;border-width:3px;"></div><div class="empty-title">正在解析抖音视频...</div></div>';

                try {
                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: actualUrl, quality: 'preview' })
                    });

                    if (response.ok) {
                        const task = await response.json();
                        previewData = { type: 'single', url: actualUrl, data: task };
                        setCachedPreview(actualUrl, previewData);
                        renderSingleVideoPreview(task);
                        addOperationLog('解析抖音视频成功: ' + (task.title || '未知标题'), 'success');
                    } else {
                        const error = await response.json();
                        container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">解析失败</div><div class="empty-desc">' + (error.detail || '未知错误') + '</div></div>';
                        addOperationLog('解析抖音视频失败: ' + (error.detail || '未知错误'), 'error');
                    }
                } catch (e) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">解析失败</div><div class="empty-desc">' + e.message + '</div></div>';
                    addOperationLog('解析抖音视频失败: ' + e.message, 'error');
                }
            } else {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔗</div><div class="empty-title">未知链接</div><div class="empty-desc">请粘贴B站或抖音链接</div></div>';
                previewData = null;
            }
        }
        
        function renderSingleVideoPreview(task) {
            const container = document.getElementById('previewContainer');
            const coverUrl = getProxyImageUrl(task.cover_url, task.platform);
            
            container.innerHTML = `
                <div class="preview-card">
                    ${coverUrl ? `
                        <div class="preview-cover-wrapper">
                            <img class="preview-cover" src="${coverUrl}" alt="封面" onerror="this.parentElement.style.display='none'">
                            ${task && task.video_url ? `<video class="preview-video" src="${task.video_url}" muted loop preload="none" playsinline></video>` : ''}
                        </div>
                    ` : ''}
                    <div class="preview-info">
                        <div style="display: flex; align-items: center; margin-bottom: 12px;">
                            ${getPlatformIcon(task.platform)}
                            <span style="font-size: 14px; font-weight: 600; flex: 1;">${task.title || '未知标题'}</span>
                        </div>
                        <div style="font-size: 13px; color: var(--gray-500); margin-bottom: 16px;">
                            作者: ${task.author || '未知'} · ${(task.actual_quality || task.quality || 'unknown').toUpperCase()}
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="action-btn primary" onclick="confirmAddPreviewTask()" style="flex: 1;">
                                ⬇ 添加下载任务
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function confirmAddPreviewTask() {
            if (!previewData || previewData.type !== 'single') {
                showToast('请先解析视频');
                return;
            }
            
            const quality = document.getElementById('qualitySelect').value;
            const url = previewData.url;
            const cachedData = getCachedPreview(url);
            
            if (cachedData && cachedData.data) {
                try {
                    const response = await fetch('/api/tasks/create-from-preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            url: url, 
                            quality: quality,
                            preview_data: cachedData.data
                        })
                    });
                    
                    if (response.ok) {
                        const task = await response.json();
                        addOperationLog('添加下载任务: ' + (task.title || '未知'), 'success');
                        showToast('任务已添加');
                        document.getElementById('urlInput').value = '';
                        clearPreview();
                        loadTasks();
                    } else {
                        const error = await response.json();
                        showToast(error.detail || '添加失败');
                    }
                } catch (e) {
                    showToast('添加失败');
                }
            } else {
                try {
                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url, quality: quality })
                    });
                    
                    if (response.ok) {
                        const task = await response.json();
                        addOperationLog('添加下载任务: ' + (task.title || '未知'), 'success');
                        showToast('任务已添加');
                        document.getElementById('urlInput').value = '';
                        clearPreview();
                        loadTasks();
                    } else {
                        const error = await response.json();
                        showToast(error.detail || '添加失败');
                    }
                } catch (e) {
                    showToast('添加失败');
                }
            }
        }
        
        function renderCollectionPreview(data) {
            const container = document.getElementById('previewContainer');
            const platform = data.platform || (data.videos && data.videos[0] && data.videos[0].video_id ? 'douyin' : 'bilibili');

            let videosHtml = '';
            if (data.videos && data.videos.length > 0) {
                videosHtml = data.videos.map((v, i) => {
                    const vid = v.bvid || v.video_id || v.url || i;
                    const cover = v.cover_url || v.cover || '';
                    return `
                    <div class="collection-video-item" data-vid="${vid}">
                        <input type="checkbox" checked class="video-checkbox" data-vid="${vid}" data-url="${v.url || ''}" data-bvid="${v.bvid || ''}" style="margin-right: 8px;">
                        <img class="collection-video-thumb" src="${getProxyImageUrl(cover, platform)}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 45%22><rect fill=%22%23333%22 width=%2280%22 height=%2245%22/><text x=%2240%22 y=%2225%22 fill=%22%23666%22 text-anchor=%22middle%22 font-size=%2212%22>封面</text></svg>'">
                        <div class="collection-video-info">
                            <div class="collection-video-title">${v.title || '未知标题'}</div>
                            <div class="collection-video-meta">${v.author || '未知'} · ${formatDuration(v.duration)}</div>
                        </div>
                    </div>`;
                }).join('');
            }

            const badgeText = platform === 'douyin' ? '抖音合集' : 'B站合集';

            container.innerHTML = `
                <div class="preview-card collection-preview">
                    <div class="preview-header">
                        <span class="preview-badge">${badgeText}</span>
                        <span class="preview-title">${data.title || '未知合集'}</span>
                    </div>
                    <div class="preview-meta">
                        作者: ${data.author || '未知'} · 共 ${data.total_count || data.count || 0} 个视频
                    </div>
                    <div class="collection-toolbar">
                        <label class="select-all-label">
                            <input type="checkbox" id="selectAllVideos" checked onchange="toggleSelectAll()">
                            <span>全选</span>
                        </label>
                        <span class="selected-count" id="selectedCount">已选 ${data.videos ? data.videos.length : 0} 个</span>
                    </div>
                    <div class="collection-videos-list">
                        ${videosHtml}
                    </div>
                    <div class="collection-actions">
                        <button class="action-btn primary" onclick="downloadCollection()">
                            ⬇ 下载全部
                        </button>
                        <button class="action-btn secondary" onclick="downloadSelectedVideos()">
                            ⬇ 下载选中
                        </button>
                    </div>
                </div>
            `;
        }
        
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAllVideos');
            const checkboxes = document.querySelectorAll('.video-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateSelectedCount();
        }
        
        function updateSelectedCount() {
            const checked = document.querySelectorAll('.video-checkbox:checked').length;
            const countEl = document.getElementById('selectedCount');
            if (countEl) countEl.textContent = '已选 ' + checked + ' 个';
        }
        
        function formatDuration(seconds) {
            if (!seconds) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        async function downloadCollection() {
            if (!previewData || previewData.type !== 'collection') {
                showToast('请先解析合集');
                return;
            }

            const quality = document.getElementById('qualitySelect').value;
            const data = previewData.data;

            try {
                const response = await fetch('/api/collections', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: previewData.url,
                        title: data.title,
                        videos: data.videos,
                        quality: quality,
                        auto_download: true  // 明确指定自动下载
                    })
                });

                if (response.ok) {
                    addOperationLog('创建合集下载任务: ' + data.title, 'success');
                    showToast('合集下载任务已创建');
                    document.getElementById('urlInput').value = '';
                    clearPreview();
                    loadTasks();
                } else {
                    const error = await response.json();
                    addOperationLog('创建合集任务失败: ' + error.detail, 'error');
                    showToast('创建失败: ' + error.detail);
                }
            } catch (e) {
                addOperationLog('创建合集任务失败: ' + e.message, 'error');
                showToast('创建失败');
            }
        }
        
        async function downloadSelectedVideos() {
            if (!previewData || previewData.type !== 'collection') {
                showToast('请先解析合集');
                return;
            }

            const checkboxes = document.querySelectorAll('.video-checkbox');
            const checkedBoxes = document.querySelectorAll('.video-checkbox:checked');
            if (checkedBoxes.length === 0) {
                showToast('请选择要下载的视频');
                return;
            }

            // 获取选中的索引（保留全部视频，只标记选中的）
            const selectedIndices = [];
            checkboxes.forEach((cb, idx) => {
                if (cb.checked) {
                    selectedIndices.push(idx);
                }
            });

            const quality = document.getElementById('qualitySelect').value;
            const data = previewData.data;

            try {
                const response = await fetch('/api/collections', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: previewData.url,
                        title: data.title,
                        videos: data.videos,
                        quality: quality,
                        auto_download: true,
                        selected_indices: selectedIndices
                    })
                });

                if (response.ok) {
                    addOperationLog('创建合集任务: 选中 ' + selectedIndices.length + '/' + data.videos.length + ' 个视频下载', 'success');
                    showToast('合集已创建，' + selectedIndices.length + ' 个视频开始下载');
                    document.getElementById('urlInput').value = '';
                    clearPreview();
                    loadCollections();
                    switchTaskMode('collection');
                } else {
                    const error = await response.json();
                    showToast('创建失败: ' + error.detail);
                }
            } catch (e) {
                showToast('创建失败');
            }
        }
        
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const middlePanel = document.querySelector('.middle-panel');
            const contentArea = document.querySelector('.content-area');
            if (!sidebar) return;

            // 点击的是任务项（单视频或合集），不处理
            if (e.target.closest('.task-item')) return;

            // 点击的是预览区域内的按钮（如下载、删除等），不处理
            if (e.target.closest('.preview-card') || e.target.closest('.collection-preview')) return;

            // 点击的是URL输入框或添加按钮，不处理
            if (e.target.closest('.sidebar-section')) return;

            // 点击的是中间面板（任务列表区域）但不是任务项，清空预览
            if (middlePanel && middlePanel.contains(e.target)) {
                clearPreview();
                return;
            }

            // 点击的是右侧内容区域（下载历史等），清空预览
            if (contentArea && contentArea.contains(e.target)) {
                clearPreview();
                return;
            }

            // 点击的是header或其他区域，清空预览
            if (!sidebar.contains(e.target)) {
                clearPreview();
            }
        });
        
        loadConfig();
        loadOperationLogs();
        loadTasks();
        loadHistory();
        refreshInterval = setInterval(loadTasks, 2000);
        setInterval(loadHistory, 5000);
        setInterval(loadCollections, 3000);
        renderOperationLogs();
        initMobileLayout();
        
        let logs = [];
        let logFilter = { level: '', task_id: '' };
        
        async function loadLogs() {
            try {
                const params = new URLSearchParams();
                if (logFilter.level) params.append('level', logFilter.level);
                if (logFilter.task_id) params.append('task_id', logFilter.task_id);
                params.append('limit', '200');
                
                const response = await fetch('/api/logs?' + params.toString());
                logs = await response.json();
                renderLogs();
            } catch (e) {
                console.error('Load logs error:', e);
            }
        }
        
        function renderLogs() {
            const container = document.getElementById('logsContainer');
            if (!container) return;

            if (logs.length === 0) {
                container.innerHTML = '<div style="color: var(--gray-400); text-align: center; padding: 40px;">暂无日志</div>';
                return;
            }

            container.innerHTML = logs.map(log => {
                let timeStr = log.timestamp || '';
                if (timeStr.includes('T')) {
                    timeStr = timeStr.split('T')[1].split('.')[0];
                } else if (timeStr.includes(' ')) {
                    timeStr = timeStr.split(' ')[1] || timeStr;
                }
                return `
                <div class="log-entry">
                    <span class="log-time">${timeStr}</span>
                    <span class="log-level ${log.level}">${log.level}</span>
                    <span class="log-task">${log.task_id || '-'}</span>
                    <span class="log-message">${escapeHtml(log.message)}</span>
                    ${log.details ? `<span class="log-details">${escapeHtml(log.details)}</span>` : ''}
                </div>`;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function filterLogs() {
            logFilter.level = document.getElementById('logLevelFilter').value;
            logFilter.task_id = document.getElementById('logTaskFilter').value;
            loadLogs();
        }
        
        function clearLogs() {
            const confirmed = window.confirm('确定要清空所有日志吗？');
            if (!confirmed) {
                return;
            }
            doClearLogs();
        }
        
        async function doClearLogs() {
            try {
                await fetch('/api/logs', { method: 'DELETE' });
                logs = [];
                renderLogs();
                showToast('日志已清空');
            } catch (e) {
                showToast('清空失败');
            }
        }
        
        function refreshLogs() {
            loadLogs();
            showToast('日志已刷新');
        }
    
        // ===== Dark Mode Toggle =====
        function initTheme() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next;
            if (current === 'dark') {
                next = 'light';
            } else if (current === 'light') {
                next = 'dark';
            } else {
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                next = prefersDark ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            var btn = document.getElementById('themeToggle');
            if (!btn) return;
            var current = document.documentElement.getAttribute('data-theme');
            var isDark;
            if (current === 'dark') {
                isDark = true;
            } else if (current === 'light') {
                isDark = false;
            } else {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
                        btn.textContent = isDark ? '☀️' : '🌙';
            btn.title = isDark ? '切换到浅色模式' : '切换到深色模式';
        }

        // Initialize theme on load
        initTheme();

        // ===== Copy Source URL =====
        function copySourceUrl(taskId) {
            var task = tasks.find(function(t) { return t.id === taskId; });
            if (!task || !task.source_url) return;
            navigator.clipboard.writeText(task.source_url).then(function() {
                var btns = document.querySelectorAll('.copy-link-btn');
                btns.forEach(function(btn) {
                    if (btn.onclick && btn.onclick.toString().indexOf(taskId) !== -1) {
                        var originalText = btn.innerHTML;
                        btn.innerHTML = '\u2705 已复制';
                        btn.classList.add('copied');
                        setTimeout(function() {
                            btn.innerHTML = originalText;
                            btn.classList.remove('copied');
                        }, 1500);
                    }
                });
            }).catch(function() {
                var textarea = document.createElement('textarea');
                textarea.value = task.source_url;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            });
        }

        async function checkForUpdate(currentVersion) {
            try {
                const resp = await fetch("https://api.github.com/repos/Star-wsc/ccnew-vdl/releases/latest");
                if (!resp.ok) return;
                const release = await resp.json();
                const latestTag = release.tag_name;
                if (!latestTag || latestTag === currentVersion) return;
                const downloadUrl = release.html_url;
                const banner = document.createElement("div");
                banner.style.cssText = "position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:16px 24px;border-radius:12px;z-index:99999;box-shadow:0 8px 32px rgba(99,102,241,0.4);max-width:360px;font-size:14px;";
                banner.innerHTML = `<div style="font-weight:700;margin-bottom:6px;">发现新版本 ${latestTag}</div><div style="opacity:0.9;margin-bottom:12px;">当前 ${currentVersion}</div><div style="display:flex;gap:8px;"><a href="${downloadUrl}" target="_blank" style="flex:1;text-align:center;background:white;color:#6366f1;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600;">去下载</a><button onclick="this.parentElement.parentElement.remove()" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:8px 16px;border-radius:8px;cursor:pointer;">稍后</button></div>`;
                document.body.appendChild(banner);
            } catch (e) {}
        }
</script>
